    // --- Services ---
    const GOOGLE_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent';

    async function callGoogle(apiKey, contents, systemInstruction) {
      const response = await fetch(`${GOOGLE_API_URL}?key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          system_instruction: {
            parts: [{ text: systemInstruction }]
          },
          contents: contents,
          generationConfig: {
            responseMimeType: systemInstruction.includes("ONLY valid JSON") ? "application/json" : "text/plain"
          }
        })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`API Error: ${JSON.parse(errorText)?.error?.message || response.statusText}`);
      }
      return await response.json();
    }

    async function extractBlueprint(apiKey, base64Image, mediaType) {
      const systemPrompt = `You are an expert image analyst. Extract the "Consistency Blueprint" of the provided image.
Return ONLY valid JSON with no markdown formatting, no fences, and no preamble.
The JSON must have the following keys exactly:
- "subjectIdentity": full physical description.
- "clothingAndAccessories": every garment and accessory.
- "lightingSetup": direction, quality, shadow behavior.
- "colorPalette": dominant colors, tone.
- "artStyleAndMedium": medium, texture.
- "cameraAndComposition": shot type, angle.
- "environmentAndBackground": setting, background detail.`;

      const contents = [
        {
          role: 'user',
          parts: [
            { inlineData: { mimeType: mediaType, data: base64Image } },
            { text: 'Extract the consistency blueprint as structured JSON.' }
          ]
        }
      ];

      const data = await callGoogle(apiKey, contents, systemPrompt);
      let textResponse = data.candidates[0].content.parts[0].text.trim();
      if (textResponse.startsWith('```')) {
        const firstNewline = textResponse.indexOf('\n');
        const lastFence = textResponse.lastIndexOf('```');
        textResponse = textResponse.substring(firstNewline !== -1 ? firstNewline : 3, lastFence !== -1 ? lastFence : textResponse.length);
      }
      return JSON.parse(textResponse);
    }

    async function generateAnglePrompt(apiKey, blueprint, angleRequest) {
      const systemPrompt = `You are a consistency guardian for image generation. Translate a new angle request into a highly detailed image generation prompt, preserving complete visual identity from the provided Consistency Blueprint.

Use this exact structure for your output (plain text):
1. [SUBJECT IDENTITY ANCHOR]: Start with "The same [subject type] from the reference image:" and use every physical detail.
2. [CLOTHING & ACCESSORIES ANCHOR]: List garments/accessories.
3. [NEW ANGLE & CAMERA DIRECTION]: Describe the requested angle/scene precisely.
4. [LIGHTING REPLICATION]: Use "Identical lighting to the reference:" and replicate setup.
5. [COLOR PALETTE LOCK]: List colors and assert tone remains unchanged.
6. [ART STYLE & MEDIUM LOCK]: Name style/medium and end with "Rendered in the same visual style and medium as the reference image."
7. [ENVIRONMENT]: Describe background from the new angle.

End your prompt exactly with these four lines:
Character identity fully consistent with the reference image.
No changes to facial features, skin tone, hair, or clothing.
Same color grading, lighting mood, and artistic style throughout.
High visual fidelity to source. This is the same individual/scene, different angle only.`;

      const blueprintText = JSON.stringify(blueprint, null, 2);
      const contents = [
        { 
          role: 'user', 
          parts: [{ text: `CONSISTENCY BLUEPRINT:\n${blueprintText}\n\nUSER REQUEST: ${angleRequest}\n\nGenerate the complete prompt.` }] 
        }
      ];

      const data = await callGoogle(apiKey, contents, systemPrompt);
      return data.candidates[0].content.parts[0].text;
    }

    // --- App Component ---
    const PresetAngles = [
      "Front View", "Rear View", "Left Profile", "Right Profile", 
      "Low Angle", "High Angle", "Close-Up Face", "Full Body"

    function App() {
      const [apiKey, setApiKey] = useState('AIzaSyDryjp9aSdDS4jv2S47HYAOLvcgDtgZOHc');

      const [isGenerating, setIsGenerating] = useState(false);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);

      // New State variables
      const [isProfileOpen, setIsProfileOpen] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(false);

      // Close profile menu when clicking outside
      const profileMenuRef = useRef(null);
      useEffect(() => {

          if (profileMenuRef.current && !profileMenuRef.current.contains(event.target)) {
            setIsProfileOpen(false);
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [profileMenuRef]);

      const toggleDarkMode = () => {
        setIsDarkMode(!isDarkMode);
        if (!isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64Full = event.target.result;
          const mimeType = base64Full.split(';')[0].split(':')[1];
          const base64Data = base64Full.split(',')[1];
          
          setUploadedImage(base64Full);
          setMediaType(mimeType);
          setBlueprint(null);
          setCurrentPrompt(null);
          setError(null);
          
          if (!isKeySet || !apiKey) {
            setError("Please save your Google API Key first.");
            return;
          }

          setIsAnalyzing(true);
          try {
            const bp = await extractBlueprint(apiKey, base64Data, mimeType);
            setBlueprint(bp);
          } catch (err) {
            setError(err.message);
          } finally {
            setIsAnalyzing(false);
          }
        };
        reader.readAsDataURL(file);
      };

        setIsGenerating(true);
        setError(null);
        setCurrentPrompt(null);
        setCopied(false);
        try {
          const prompt = await generateAnglePrompt(apiKey, blueprint, angleRequest);
          setCurrentPrompt(prompt);
        } catch (err) {
          setError(err.message);
        } finally {
          setIsGenerating(false);
        }

      const copyToClipboard = () => {
        if (currentPrompt) {
          navigator.clipboard.writeText(currentPrompt);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const formatKey = (key) => {
        const formatted = key.replace(/([A-Z])/g, ' $1');
        return formatted.charAt(0).toUpperCase() + formatted.slice(1);
      };

      return (
        <React.Fragment>

              >
                 <div className="w-10 h-10 rounded-full overflow-hidden border-2 border-dashBg dark:border-darkInput">
                   <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix&backgroundColor=ffcf54" alt="Avatar" />
                 </div>
              </div>

              {isProfileOpen && (
                <div className="absolute bottom-0 left-20 ml-4 w-60 bg-white/95 dark:bg-darkWhite/95 backdrop-blur-xl rounded-[1.5rem] p-3 shadow-2xl border border-gray-100 dark:border-white/5 apple-enter z-50 transition-colors duration-500">
                   <div className="px-3 py-2 mb-2 border-b border-gray-100 dark:border-gray-800">
                     <p className="text-[14px] font-bold text-textMain dark:text-white">Vishnu Sharma</p>
                     <p className="text-[12px] font-medium text-textMuted">Free Tier</p>
                   </div>
                   
                   <button className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-dashBg dark:hover:bg-darkInput text-textMain dark:text-white text-[13px] font-semibold apple-transition">
                     <SettingsIcon className="w-4 h-4 text-gray-400" />
                     Settings
                   </button>
                   
                   <button onClick={toggleDarkMode} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-dashBg dark:hover:bg-darkInput text-textMain dark:text-white text-[13px] font-semibold apple-transition">

                     <LogOutIcon />

                </div>
              )}
            </div>
          </div>
          
          {/* Main Content Container */}

                    </div>
                    <button

                <div className="xl:col-span-7 bg-cardSand dark:bg-darkCardSand rounded-[2rem] p-8 flex flex-col relative overflow-hidden shadow-sm min-h-[360px] z-10 group apple-enter apple-delay-2 apple-transition hover:shadow-lg hover:-translate-y-1 transition-colors duration-500">
                  <div className="blob-yellow"></div>
                  <div className="blob-pink"></div>
                  
                  <div className="relative z-10 flex flex-col h-full">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-bold text-[#3f3b35] dark:text-white">Reference Image</h2>
                      {uploadedImage && (
                        <button 
                          onClick={() => { setUploadedImage(null); setBlueprint(null); setCurrentPrompt(null); }}
                          className="bg-white/50 dark:bg-darkWhite/50 hover:bg-white/80 dark:hover:bg-darkWhite/80 text-[#3f3b35] dark:text-white p-2 rounded-full backdrop-blur-sm transition-colors"
                        >
                          <TrashIcon />
                        </button>
                      )}
                    </div>
                    
                    <div 
                      className={`flex-1 rounded-[1.5rem] border-2 border-dashed ${uploadedImage ? 'border-transparent bg-transparent' : 'border-[#b8b0a3] dark:border-gray-600 hover:border-[#3f3b35] dark:hover:border-white bg-white/30 dark:bg-darkInput/30 backdrop-blur-sm'} flex flex-col items-center justify-center text-center transition-all cursor-pointer relative overflow-hidden`}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => { e.preventDefault(); handleImageUpload(e); }}
                    >
                      <input 
                        type="file" 
                        accept="image/jpeg, image/png, image/webp" 
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" 
                        onChange={handleImageUpload} 
                        title=""
                      />
                      
                      {uploadedImage ? (
                        <img src={uploadedImage} alt="Reference" className="w-full h-full object-contain drop-shadow-xl" />
                      ) : (
                        <div className="flex flex-col items-center p-8 pointer-events-none text-[#5c564d] dark:text-gray-300">
                          <div className="w-16 h-16 bg-white dark:bg-darkInput rounded-full flex items-center justify-center mb-4 shadow-sm text-cardDark dark:text-white">
                            <ImagePlusIcon />
                          </div>
                          <h3 className="font-bold text-lg mb-1">Upload Reference</h3>
                          <p className="text-[14px] font-medium opacity-80">Drag & drop or click to browse</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
                
                {/* TOP RIGHT: Output Prompt (Dark Card) */}
                <div className="xl:col-span-5 bg-cardDark dark:bg-darkCardDark rounded-[2rem] p-8 text-white flex flex-col shadow-xl min-h-[360px] apple-enter apple-delay-3 apple-transition hover:shadow-2xl hover:-translate-y-1 transition-colors duration-500">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold">Generated Prompt</h2>
                    {currentPrompt && (
                      <button 
                        onClick={copyToClipboard}
                        className="bg-[#383a40] hover:bg-[#4b4e55] dark:bg-[#1a1c20] dark:hover:bg-[#252830] text-white px-4 py-2 rounded-full text-[13px] font-bold transition-colors flex items-center gap-2"
                      >
                        {copied ? <React.Fragment><CheckIcon/> Copied</React.Fragment> : <React.Fragment><CopyIcon/> Copy text</React.Fragment>}
                      </button>
                    )}
                  </div>
                  
                  <div className="flex-1 bg-[#1a1c1f] dark:bg-[#15171a] rounded-[1.5rem] p-6 overflow-auto dark-scrollbar border border-[#2f3238] dark:border-gray-800">
                    {isGenerating ? (
                      <div className="space-y-4">
                        <div className="h-3 w-3/4 skeleton-line-dark"></div>
                        <div className="h-3 w-full skeleton-line-dark"></div>
                        <div className="h-3 w-5/6 skeleton-line-dark"></div>
                        <div className="h-3 w-2/3 skeleton-line-dark"></div>
                        <div className="h-3 w-full skeleton-line-dark mt-6"></div>
                        <div className="h-3 w-4/5 skeleton-line-dark"></div>
                      </div>
                    ) : currentPrompt ? (
                      <p className="text-[14px] leading-relaxed text-gray-300 whitespace-pre-wrap selection:bg-accentYellow selection:text-black">
                        {currentPrompt}
                      </p>
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-[#555a64]">
                        <div className="w-12 h-12 rounded-full border-2 border-[#383a40] dark:border-gray-800 flex items-center justify-center mb-3">
                          <LayersIcon />
                        </div>
                        <span className="text-[14px] font-medium">Prompt will appear here</span>
                      </div>
                    )}
                  </div>
                </div>
                
                {/* BOTTOM LEFT: Consistency Blueprint (White Card) */}
                <div className="xl:col-span-7 bg-white/90 dark:bg-darkWhite/90 backdrop-blur-md rounded-[2rem] p-8 shadow-sm flex flex-col min-h-[400px] apple-enter apple-delay-3 apple-transition hover:shadow-lg hover:-translate-y-1 transition-colors duration-500">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-textMain dark:text-white flex items-center gap-3">
                      Extracted Blueprint
                      {isAnalyzing && <span className="bg-accentYellow/20 text-[#b58500] dark:text-accentYellow text-[12px] px-3 py-1 rounded-full font-bold animate-pulse">Analyzing...</span>}
                    </h2>
                  </div>
                  
                  <div className="flex-1 overflow-auto custom-scrollbar pr-2 grid grid-cols-1 md:grid-cols-2 gap-4 auto-rows-max content-start">
                    {isAnalyzing ? (
                      Array(6).fill(0).map((_, i) => (
                        <div key={i} className="bg-dashBg dark:bg-darkInput rounded-2xl p-5 border border-transparent">
                           <div className="h-3 w-1/3 skeleton-line mb-3"></div>
                           <div className="h-2 w-full skeleton-line mb-2"></div>
                           <div className="h-2 w-4/5 skeleton-line"></div>
                        </div>
                      ))
                    ) : blueprint ? (
                      Object.entries(blueprint).map(([key, value]) => (
                        <div key={key} className="bg-dashBg dark:bg-darkInput rounded-2xl p-5 hover:bg-gray-100 dark:hover:bg-[#2a2d36] transition-colors border border-transparent">
                          <h4 className="text-[13px] font-bold text-textMain dark:text-white mb-1.5 flex items-center gap-2">
                            <div className="w-1.5 h-1.5 rounded-full bg-accentYellow"></div>
                            {formatKey(key)}
                          </h4>
                          <p className="text-[14px] text-textMuted dark:text-gray-400 leading-snug line-clamp-3 hover:line-clamp-none transition-all">{value}</p>
                        </div>
                      ))
                    ) : (
                      <div className="col-span-1 md:col-span-2 h-full min-h-[200px] flex items-center justify-center text-textMuted dark:text-gray-400 text-[14px] font-medium bg-dashBg dark:bg-darkInput rounded-[1.5rem] border-2 border-dashed border-gray-200 dark:border-gray-700">
                        Upload an image to extract visual attributes
                      </div>
                    )}
                  </div>
                </div>
                
                {/* BOTTOM RIGHT: Angle Request (White Card) */}
                <div className="xl:col-span-5 bg-white/90 dark:bg-darkWhite/90 backdrop-blur-md rounded-[2rem] p-8 shadow-sm flex flex-col min-h-[400px] apple-enter apple-delay-4 apple-transition hover:shadow-lg hover:-translate-y-1 transition-colors duration-500">
                  <h2 className="text-xl font-bold text-textMain dark:text-white mb-6">Request New Angle</h2>
                  
                  <div className="flex flex-wrap gap-2 mb-5">
                    {PresetAngles.map(angle => (
                      <button 
                        key={angle}
                        onClick={() => setAngleRequest(angle)}
                        className={`text-[13px] font-semibold px-4 py-2 rounded-full transition-all ${angleRequest === angle ? 'bg-cardDark dark:bg-darkInput text-white shadow-md scale-105' : 'bg-dashBg dark:bg-darkInput text-textMuted dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 hover:text-textMain dark:hover:text-white'}`}
                      >
                        {angle}
                      </button>
                    ))}
                  </div>

                  <textarea 
                    value={angleRequest}
                    onChange={(e) => setAngleRequest(e.target.value)}
                    placeholder="Describe specific changes (e.g. 'cinematic close up of the face, looking left')..."
                    className="flex-1 w-full bg-dashBg dark:bg-darkInput rounded-[1.5rem] p-5 text-[15px] font-medium text-textMain dark:text-white focus:outline-none focus:ring-2 focus:ring-accentYellow resize-none custom-scrollbar placeholder-gray-400 dark:placeholder-gray-500 mb-5 transition-colors duration-500"
                    disabled={!blueprint}
                  />

                  <button 
                    onClick={handleGenerate}
                    disabled={!blueprint || !angleRequest.trim() || isGenerating}
                    className="w-full bg-accentYellow hover:bg-[#f7c236] disabled:bg-dashBg dark:disabled:bg-darkInput disabled:text-gray-400 dark:disabled:text-gray-600 text-cardDark font-bold py-4 rounded-full apple-transition text-[16px] shadow-sm hover:shadow-md hover:scale-[1.02] active:scale-[0.98]"
                  >
                    {isGenerating ? 'Generating Prompt...' : 'Generate Perfect Prompt'}
                  </button>
                </div>

              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
